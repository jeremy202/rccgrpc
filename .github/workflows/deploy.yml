# Builds the site and uploads it to cPanel every time something is pushed to
# main — including every “Publish” from the website editor (/admin).
#
# Repository secrets needed (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER     e.g. ftp.rccgrpc.ca
#   FTP_USERNAME   cPanel FTP username
#   FTP_PASSWORD   cPanel FTP password
#   FTP_SERVER_DIR (optional) folder to upload into, ending in "/". Default: public_html/
#   FTP_PROTOCOL   (optional) ftps (default) or ftp

name: Build & deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Generate static site
        run: npx nuxi generate

      - name: Upload to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./.output/public/
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
